# Builds the two Dockerfile targets and publishes them to GitHub Container
# Registry, so a deployment host (e.g. Dockge) can pull prebuilt images via
# docker-compose.prod.yml instead of building from source:
#
#   ghcr.io/<owner>/<repo>          <- `app` target
#   ghcr.io/<owner>/<repo>-migrate  <- `migrate` target
#
# Tags: `latest` + `sha-<short>` on every push to main; `1.2.3` + `1.2` on a
# `v1.2.3` git tag. Deploy hosts track `latest` by default (IMAGE_TAG in
# docker-compose.prod.yml pins a specific one).
name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: app
            suffix: ""
          - target: migrate
            suffix: "-migrate"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # GHCR image names must be lowercase.
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          # amd64 only. For an ARM host (Raspberry Pi, Ampere, Apple-silicon
          # VM) add linux/arm64 here plus a docker/setup-qemu-action step —
          # emulated arm64 Next.js builds are several times slower.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
